[package]
name = "arui-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System tray (notification area) host for ARUI: Shell_TrayWnd emulation"

[dependencies]
arui-win.workspace = true
serde.workspace = true
log.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
# examples/tray_dump.rs self-tests Shell_NotifyIcon and appbar forwarding.
windows = { workspace = true, features = ["Win32_UI_Shell"] }
