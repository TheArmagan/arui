[workspace]
resolver = "2"
members = [
    "natives/arui-win",
    "natives/arui-windows",
    "natives/arui-shell",
    "natives/arui-tray",
    "natives/arui-media",
    "natives/arui-system",
    "natives/arui-guard",
    "renderers/shell/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Kıraç Armağan Önal"]

# Shared dependency versions. Crates opt into `windows` features in their own Cargo.toml:
#   windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
png = "0.17"

arui-win = { path = "natives/arui-win" }
arui-windows = { path = "natives/arui-windows" }
arui-shell = { path = "natives/arui-shell" }
arui-tray = { path = "natives/arui-tray" }
arui-media = { path = "natives/arui-media" }
arui-system = { path = "natives/arui-system" }

[profile.release]
lto = true
codegen-units = 1
strip = true
